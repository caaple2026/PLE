/* O ficheiro único substitui o documento no arranque, o que remove as tags
   de instalação do <head>. Este temporizador vive em window e sobrevive a
   essa substituição, repondo as tags para o navegador poder instalar a app. */
(function () {
  var TAGS = [
    ['link', { rel: 'manifest', href: 'manifest.json' }],
    ['link', { rel: 'apple-touch-icon', href: 'icone-192.png' }],
    ['link', { rel: 'icon', type: 'image/png', sizes: '512x512', href: 'icone-512.png' }],
    ['meta', { name: 'theme-color', content: '#0361D9' }],
    ['meta', { name: 'mobile-web-app-capable', content: 'yes' }],
    ['meta', { name: 'apple-mobile-web-app-capable', content: 'yes' }],
    ['meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'default' }],
    ['meta', { name: 'apple-mobile-web-app-title', content: 'PLE' }],
    ['meta', { name: 'robots', content: 'noindex, nofollow, noarchive' }],
    ['meta', { name: 'viewport', content: 'width=device-width, initial-scale=1, viewport-fit=cover' }]
  ];
  function seletor(t, a) {
    return t + (a.rel ? '[rel="' + a.rel + '"]' + (a.sizes ? '[sizes="' + a.sizes + '"]' : '') : '[name="' + a.name + '"]');
  }
  function repor() {
    var head = document.head;
    if (!head) return;
    for (var i = 0; i < TAGS.length; i++) {
      var t = TAGS[i][0], a = TAGS[i][1];
      if (head.querySelector(seletor(t, a))) continue;
      var el = document.createElement(t);
      for (var k in a) el.setAttribute(k, a[k]);
      head.appendChild(el);
    }
    if (document.title === 'Bundled Page' || !document.title) document.title = 'PLE — Projeto de Leitura e Escrita';
  }
  repor();
  var n = 0;
  var id = setInterval(function () { repor(); if (++n > 40) clearInterval(id); }, 400);
  window.addEventListener('load', function () {
    repor();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  });
})();

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d028f790-3244-4007-a475-d73de96c1d72\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<script src=\"60795fd2-eae2-47ec-b791-a12cb2643589\"><\u002Fscript>\n<script src=\"01593e10-8081-465b-ab00-e72861fd314d\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: #F7F9FC; font-family: Arial, Helvetica, sans-serif; }\n  * { box-sizing: border-box; }\n  button { font-family: inherit; cursor: pointer; }\n  input, select { font-family: inherit; }\n  a { color: #0361D9; text-decoration: none; }\n  a:hover { color: #024FB0; text-decoration: underline; }\n  @keyframes ple-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  @media print {\n    [data-noprint] { display: none !important; }\n    html, body { background: #fff !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; background:#F7F9FC; font-family:Arial,Helvetica,sans-serif; color:#222933; -webkit-font-smoothing:antialiased\">\n\n  <sc-if value=\"{{ mostrarChrome }}\" hint-placeholder-val=\"{{ true }}\">\n    <header data-noprint=\"\" style=\"position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.88); backdrop-filter:blur(10px); border-bottom:1px solid #E4E9F0\">\n      <div style=\"max-width:1240px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap\">\n        <div style=\"display:flex; align-items:baseline; gap:12px\">\n          <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:30px; line-height:1; letter-spacing:0.01em\">PLE<\u002Fspan>\n          <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B7687\">Projeto de Leitura e Escrita<\u002Fspan>\n        <\u002Fdiv>\n        <nav style=\"display:flex; gap:6px; flex-wrap:wrap\">\n          <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ n.ir }}\" style=\"border:1px solid {{ n.borda }}; background:{{ n.fundo }}; color:{{ n.cor }}; font-size:14px; font-weight:500; padding:8px 14px; border-radius:99px; transition:background 0.15s, border-color 0.15s\" style-hover=\"border-color:#B6C4D6\">{{ n.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <div style=\"height:3px; background:repeating-linear-gradient(90deg, #0361D9 0 9px, transparent 9px 18px); opacity:0.5\"><\u002Fdiv>\n    <\u002Fheader>\n  <\u002Fsc-if>\n\n  <!-- ══ DASHBOARD ══ -->\n  <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"max-width:1240px; margin:0 auto; padding:56px 28px 90px; animation:ple-in 0.3s ease-out\">\n      <section style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:40px; align-items:center; margin-bottom:64px\">\n        <div>\n          <h1 style=\"margin:0; font-family:Arial,Helvetica,sans-serif; font-size:clamp(56px,7vw,84px); line-height:0.95; letter-spacing:-0.01em\">PLE<\u002Fh1>\n          <p style=\"margin:10px 0 0; font-family:Arial,Helvetica,sans-serif; font-size:clamp(24px,3vw,32px); line-height:1.2; color:#39434F\">Projeto de Leitura e Escrita<\u002Fp>\n          <p style=\"margin:6px 0 0; font-family:Arial,Helvetica,sans-serif; font-style:italic; font-size:24px; color:#0361D9\">Linguaré.<\u002Fp>\n          <p style=\"margin:26px 0 0; max-width:52ch; font-size:16px; line-height:1.6; color:#5E6A79; text-wrap:pretty\">Bateria de avaliação de competências de leitura e escrita, aplicada individualmente em 8 a 10 minutos. Registo item a item, perfil por competência e comparação Pré/Pós.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"justify-self:end; display:flex; flex-direction:column; align-items:flex-end; gap:22px\">\n          <sc-if value=\"{{ temLogo }}\" hint-placeholder-val=\"{{ false }}\">\n            <span role=\"img\" aria-label=\"Escola Camilo Castelo Branco · Centro de Apoio à Aprendizagem\" style=\"display:block; height:34px; width:300px; background:{{ logoFundoDir }}\"><\u002Fspan>\n          <\u002Fsc-if>\n          <dc-import name=\"Linguare\" tamanho=\"{{ mascoteGrande }}\" imagem=\"{{ mascoteImagem }}\" hint-size=\"200px,220px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <h2 style=\"margin:0 0 16px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Indicadores do projeto<\u002Fh2>\n      <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:14px; margin-bottom:56px\">\n        <sc-for list=\"{{ indicadores }}\" as=\"i\" hint-placeholder-count=\"5\">\n          <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:14px; padding:20px 22px\">\n            <div style=\"font-family:Arial,Helvetica,sans-serif; font-size:38px; line-height:1; color:#272E38\">{{ i.valor }}<\u002Fdiv>\n            <div style=\"margin-top:10px; font-size:13px; line-height:1.35; color:#64707F\">{{ i.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <h2 style=\"margin:0 0 16px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Acções<\u002Fh2>\n      <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:14px\">\n        <sc-for list=\"{{ acoes }}\" as=\"a\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ a.ir }}\" style=\"text-align:left; background:{{ a.fundo }}; border:1px solid {{ a.borda }}; border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:8px; transition:transform 0.15s, box-shadow 0.15s\" style-hover=\"transform:translateY(-2px); box-shadow:0 14px 30px -24px rgba(60,40,20,0.7)\">\n            <span style=\"font-size:18px; font-weight:500; color:{{ a.cor }}\">{{ a.titulo }}<\u002Fspan>\n            <span style=\"font-size:13.5px; line-height:1.45; color:{{ a.corDesc }}\">{{ a.desc }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ CRIANÇAS / NOVA AVALIAÇÃO ══ -->\n  <sc-if value=\"{{ isCriancas }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:1100px; margin:0 auto; padding:48px 28px 90px; animation:ple-in 0.3s ease-out\">\n      <h1 style=\"margin:0 0 4px; font-family:Arial,Helvetica,sans-serif; font-size:44px; line-height:1.1\">{{ tituloCriancas }}<\u002Fh1>\n      <p style=\"margin:0 0 32px; font-size:15px; color:#64707F\">{{ subtituloCriancas }}<\u002Fp>\n\n      <section style=\"background:#fff; border:1px solid #E4E9F0; border-radius:16px; padding:26px; margin-bottom:34px\">\n        <h2 style=\"margin:0 0 20px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Identificação<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; align-items:end\">\n          <label style=\"display:flex; flex-direction:column; gap:7px\">\n            <span style=\"font-size:13px; font-weight:500; color:#4B5765\">Nome<\u002Fspan>\n            <input type=\"text\" value=\"{{ form.nome }}\" sc-camel-on-change=\"{{ setNome }}\" placeholder=\"Nome da criança\" style=\"font-size:16px; padding:12px 14px; border:1px solid #DCE3EC; border-radius:10px; background:#FCFDFF; color:#222933; min-height:46px\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:7px\">\n            <span style=\"font-size:13px; font-weight:500; color:#4B5765\">Turma<\u002Fspan>\n            <sc-raw-select value=\"{{ form.turma }}\" sc-camel-on-change=\"{{ setTurma }}\" style=\"font-size:16px; padding:12px 14px; border:1px solid #DCE3EC; border-radius:10px; background:#FCFDFF; color:#222933; min-height:46px\">\n              <sc-for list=\"{{ turmas }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <div style=\"display:flex; flex-direction:column; gap:7px\">\n            <span style=\"font-size:13px; font-weight:500; color:#4B5765\">Momento<\u002Fspan>\n            <div style=\"display:flex; gap:8px\">\n              <sc-for list=\"{{ momentos }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ m.escolher }}\" style=\"flex:1; min-height:46px; font-size:15px; font-weight:500; border:1px solid {{ m.borda }}; background:{{ m.fundo }}; color:{{ m.cor }}; border-radius:10px\">{{ m.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px\">\n            <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:#6B7687\">Nível · {{ nivelForm }} · {{ nItensForm }} itens<\u002Fspan>\n            <button sc-camel-on-click=\"{{ iniciar }}\" style=\"min-height:46px; font-size:15.5px; font-weight:500; border:none; border-radius:10px; background:#0361D9; color:#fff; padding:0 22px\" style-hover=\"background:#024FB0\">Começar missão<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ temAviso }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:18px 0 0; padding:12px 14px; border-radius:10px; background:#EAF3FE; border:1px solid #BDD6F6; font-size:14px; line-height:1.5; color:#0A3A7D\">{{ aviso }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:14px; flex-wrap:wrap\">\n        <h2 style=\"margin:0; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Crianças registadas · {{ nCriancas }}<\u002Fh2>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n          <sc-for list=\"{{ filtroTurmaLista }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ f.escolher }}\" style=\"font-size:13px; font-weight:500; padding:6px 12px; border-radius:99px; border:1px solid {{ f.borda }}; background:{{ f.fundo }}; color:{{ f.cor }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ semCriancas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff; border:1px dashed #D3DCE8; border-radius:16px; padding:40px; text-align:center\">\n          <p style=\"margin:0 0 6px; font-family:Arial,Helvetica,sans-serif; font-size:24px\">Ainda não há crianças registadas.<\u002Fp>\n          <p style=\"margin:0 0 22px; font-size:14.5px; color:#64707F\">Preenche a identificação acima para registar a primeira criança e iniciar a avaliação.<\u002Fp>\n          <button sc-camel-on-click=\"{{ carregarDemo }}\" style=\"font-size:14px; padding:10px 18px; border-radius:10px; border:1px solid #DCE3EC; background:#F2F5F9; color:#47525F\">Carregar dados de demonstração<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-for list=\"{{ listaCriancas }}\" as=\"c\" hint-placeholder-count=\"0\">\n        <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:14px; padding:16px 20px; margin-bottom:10px; display:flex; align-items:center; gap:16px; flex-wrap:wrap\">\n          <div style=\"flex:1 1 200px; min-width:0\">\n            <div style=\"font-size:16.5px; font-weight:500\">{{ c.nome }}<\u002Fdiv>\n            <div style=\"margin-top:3px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.08em; color:#6B7687\">{{ c.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:7px; flex-wrap:wrap\">\n            <sc-for list=\"{{ c.estados }}\" as=\"e\" hint-placeholder-count=\"2\">\n              <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; padding:5px 9px; border-radius:6px; background:{{ e.fundo }}; color:{{ e.cor }}\">{{ e.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n            <sc-for list=\"{{ c.acoes }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ a.acao }}\" style=\"font-size:13.5px; font-weight:500; min-height:40px; padding:0 14px; border-radius:9px; border:1px solid {{ a.borda }}; background:{{ a.fundo }}; color:{{ a.cor }}\">{{ a.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <section style=\"margin-top:34px; padding-top:26px; border-top:1px solid #E4E9F0\">\n        <h2 style=\"margin:0 0 6px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Dados e cópias de segurança<\u002Fh2>\n        <p style=\"margin:0 0 16px; max-width:70ch; font-size:13.5px; line-height:1.55; color:#64707F; text-wrap:pretty\">Os dados ficam neste dispositivo. Para reunir as avaliações de vários iPads, exporta o CSV de respostas em cada um e importa-os aqui, no dispositivo da coordenação. Avaliações que já existam não são duplicadas.<\u002Fp>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center\">\n          <label style=\"font-size:13.5px; font-weight:500; padding:10px 16px; border-radius:9px; border:1px solid #0361D9; background:#0361D9; color:#fff; cursor:pointer; min-height:42px; display:inline-flex; align-items:center\">\n            Importar CSV de respostas\n            <input type=\"file\" accept=\".csv,text/csv\" sc-camel-on-change=\"{{ importarCsv }}\" style=\"position:absolute; width:1px; height:1px; opacity:0; pointer-events:none\">\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ exportarCsvRespostas }}\" style=\"font-size:13.5px; padding:10px 16px; border-radius:9px; border:1px solid #DCE3EC; background:#fff; color:#47525F; min-height:42px\">Exportar CSV — respostas item a item<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ exportarCsvResultados }}\" style=\"font-size:13.5px; padding:10px 16px; border-radius:9px; border:1px solid #DCE3EC; background:#fff; color:#47525F; min-height:42px\">Exportar CSV — resultados por criança<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ apagarTudo }}\" style=\"font-size:13.5px; padding:10px 16px; border-radius:9px; border:1px solid #F0D8D8; background:#fff; color:#B4453C; min-height:42px\">Apagar todos os dados locais<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ temImporte }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:18px; padding:18px 20px; border-radius:12px; background:{{ importeFundo }}; border:1px solid {{ importeBorda }}\">\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px\">\n              <p style=\"margin:0; font-size:15px; font-weight:700; color:{{ importeCor }}\">{{ importe.titulo }}<\u002Fp>\n              <button sc-camel-on-click=\"{{ fecharImporte }}\" style=\"font-size:12.5px; padding:5px 10px; border-radius:7px; border:1px solid #DCE3EC; background:#fff; color:#5E6A79\">Fechar<\u002Fbutton>\n            <\u002Fdiv>\n            <ul style=\"margin:12px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:5px\">\n              <sc-for list=\"{{ importe.linhas }}\" as=\"l\" hint-placeholder-count=\"2\">\n                <li style=\"font-size:13.5px; line-height:1.5; color:#39434F\">{{ l }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ AVALIAÇÃO (criança + avaliador) ══ -->\n  <sc-if value=\"{{ isRun }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh; display:flex; flex-direction:column; background:#F6F9FD\">\n      <div style=\"flex:1; display:flex; align-items:center; justify-content:center; padding:44px 28px; background-image:radial-gradient(#DCE6F2 1px, transparent 1px); background-size:26px 26px\">\n        <div style=\"width:100%; max-width:980px; text-align:center\">\n\n          <sc-if value=\"{{ run.isIntro }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; justify-content:center; animation:ple-in 0.35s ease-out\">\n              <dc-import name=\"Linguare\" tamanho=\"{{ mascoteGrande }}\" imagem=\"{{ mascoteImagem }}\" fala=\"{{ textoIntro }}\" hint-size=\"420px,220px\"><\u002Fdc-import>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ run.isItem }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"display:inline-flex; align-items:center; gap:10px; padding:7px 16px; border-radius:99px; background:#fff; border:1px solid #E4E9F0\">\n                <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#0361D9\">Missão {{ run.missaoNum }}<\u002Fspan>\n                <span style=\"width:1px; height:12px; background:#DCE3EC\"><\u002Fspan>\n                <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:17px; color:#313A45\">{{ run.missaoTitulo }}<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:26px; display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap\">\n                <dc-import name=\"Linguare\" tamanho=\"{{ mascotePequeno }}\" imagem=\"{{ mascoteImagem }} e:15px; color:#64707F\">{{ stats.legenda }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:14px; flex-wrap:wrap\">\n          <sc-if value=\"{{ temLogo }}\" hint-placeholder-val=\"{{ false }}\">\n            <span role=\"img\" aria-label=\"Escola Camilo Castelo Branco · Centro de Apoio à Aprendizagem\" style=\"display:block; height:36px; width:318px; background:{{ logoFundoEsq }}\"><\u002Fspan>\n          <\u002Fsc-if>\n          <button data-noprint=\"\" sc-camel-on-click=\"{{ imprimir }}\" style=\"font-size:13.5px; padding:10px 16px; border-radius:9px; border:1px solid #DCE3EC; background:#fff; color:#47525F\">Exportar PDF estatístico<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section data-noprint=\"\" style=\"margin:28px 0 34px; display:flex; gap:26px; flex-wrap:wrap\">\n        <sc-for list=\"{{ stats.filtros }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B7687; margin-bottom:8px\">{{ g.titulo }}<\u002Fdiv>\n            <div style=\"display:flex; gap:7px; flex-wrap:wrap\">\n              <sc-for list=\"{{ g.opcoes }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.escolher }}\" style=\"font-size:13.5px; font-weight:500; min-height:38px; padding:0 14px; border-radius:99px; border:1px solid {{ o.borda }}; background:{{ o.fundo }}; color:{{ o.cor }}\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <h2 style=\"margin:0 0 14px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Participação<\u002Fh2>\n      <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:40px\">\n        <sc-for list=\"{{ stats.participacao }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:14px; padding:20px 22px\">\n            <div style=\"font-family:Arial,Helvetica,sans-serif; font-size:36px; line-height:1\">{{ p.valor }}<\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:13px; line-height:1.35; color:#64707F\">{{ p.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <h2 style=\"margin:0 0 14px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">Resultados<\u002Fh2>\n      <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:40px\">\n        <sc-for list=\"{{ stats.resultados }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:14px; padding:20px 22px\">\n            <div style=\"font-family:Arial,Helvetica,sans-serif; font-size:32px; line-height:1\">{{ r.valor }}<\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:13px; line-height:1.35; color:#64707F\">{{ r.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <sc-if value=\"{{ stats.temParidade }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"margin-bottom:40px\">\n          <h2 style=\"margin:0 0 6px; font-family:Arial,Helvetica,sans-serif; font-size:28px\">Comparação Pré/Pós por domínio<\u002Fh2>\n          <p style=\"margin:0 0 16px; font-size:13.5px; color:#64707F\">{{ stats.paridadeNota }}<\u002Fp>\n          <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:16px; overflow:hidden\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,1.4fr) 92px 92px 92px; gap:12px; padding:13px 22px; background:#F2F5F9; font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:#5E6A79\">\n              <span>Domínio<\u002Fspan><span style=\"text-align:right\">Pré<\u002Fspan><span style=\"text-align:right\">Pós<\u002Fspan><span style=\"text-align:right\">Variação<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ stats.dominios }}\" as=\"d\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:minmax(0,1.4fr) 92px 92px 92px; gap:12px; padding:14px 22px; border-top:1px solid #EEF2F7; align-items:center; font-size:14px\">\n                <span style=\"color:#39434F\">{{ d.label }}<\u002Fspan>\n                <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:#545F6E\">{{ d.pre }}<\u002Fspan>\n                <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:#313A45\">{{ d.pos }}<\u002Fspan>\n                <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:{{ d.varCor }}\">{{ d.variacao }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ stats.temDistribuicao }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"margin-bottom:40px\">\n          <h2 style=\"margin:0 0 16px; font-family:Arial,Helvetica,sans-serif; font-size:28px\">Distribuição dos resultados<\u002Fh2>\n          <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:16px; padding:24px 26px\">\n            <div style=\"display:flex; align-items:flex-end; gap:18px; height:170px\">\n              <sc-for list=\"{{ stats.distribuicao }}\" as=\"b\" hint-placeholder-count=\"5\">\n                <div style=\"flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; height:100%\">\n                  <div style=\"display:flex; align-items:flex-end; gap:5px; height:100%\">\n                    <span style=\"flex:1; display:block; height:{{ b.preH }}; background:#0BD08E; border-radius:6px 6px 0 0\"><\u002Fspan>\n                    <span style=\"flex:1; display:block; height:{{ b.posH }}; background:#0361D9; border-radius:6px 6px 0 0\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; text-align:center; color:#5E6A79\">{{ b.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:20px; margin-top:16px; font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#6B7687\">\n              <span style=\"display:flex; align-items:center; gap:7px\"><span style=\"width:14px; height:7px; border-radius:99px; background:#0BD08E\"><\u002Fspan>Pré<\u002Fspan>\n              <span style=\"display:flex; align-items:center; gap:7px\"><span style=\"width:14px; height:7px; border-radius:99px; background:#0361D9\"><\u002Fspan>Pós<\u002Fspan>\n              <span style=\"margin-left:auto; text-transform:none; letter-spacing:0\">Eixo horizontal: resultado global em percentagem<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <section>\n        <h2 style=\"margin:0 0 6px; font-family:Arial,Helvetica,sans-serif; font-size:28px\">Turmas<\u002Fh2>\n        <p style=\"margin:0 0 16px; font-size:13.5px; color:#64707F\">Apresentadas por ordem alfabética. O PLE não produz classificações entre turmas.<\u002Fp>\n        <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:16px; overflow:hidden\">\n          <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 62px 96px 96px 96px; gap:12px; padding:13px 22px; background:#F2F5F9; font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:#5E6A79\">\n            <span>Turma<\u002Fspan><span style=\"text-align:right\">N<\u002Fspan><span style=\"text-align:right\">Média Pré<\u002Fspan><span style=\"text-align:right\">Média Pós<\u002Fspan><span style=\"text-align:right\">Evolução<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ stats.turmas }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 62px 96px 96px 96px; gap:12px; padding:14px 22px; border-top:1px solid #EEF2F7; align-items:center; font-size:14px\">\n              <span style=\"color:#313A45; font-weight:500\">{{ t.turma }}<\u002Fspan>\n              <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:#545F6E\">{{ t.n }}<\u002Fspan>\n              <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:#545F6E\">{{ t.pre }}<\u002Fspan>\n              <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:#313A45\">{{ t.pos }}<\u002Fspan>\n              <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:13px; text-align:right; color:{{ t.varCor }}\">{{ t.variacao }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ MANUAL DO AVALIADOR ══ -->\n  <sc-if value=\"{{ isManual }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:900px; margin:0 auto; padding:48px 28px 100px; animation:ple-in 0.3s ease-out\">\n      <h1 style=\"margin:0 0 4px; font-family:Arial,Helvetica,sans-serif; font-size:44px; line-height:1.1\">Manual do Avaliador<\u002Fh1>\n      <p style=\"margin:0 0 26px; font-size:15px; color:#64707F\">PLE — Projeto de Leitura e Escrita. Aplicação padronizada da bateria.<\u002Fp>\n\n      <div data-noprint=\"\" style=\"display:flex; gap:8px; margin-bottom:34px; flex-wrap:wrap\">\n        <sc-for list=\"{{ tabsManual }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ t.escolher }}\" style=\"font-size:14px; font-weight:500; min-height:40px; padding:0 16px; border-radius:99px; border:1px solid {{ t.borda }}; background:{{ t.fundo }}; color:{{ t.cor }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ manualTexto }}\" hint-placeholder-val=\"{{ true }}\">\n        <article style=\"display:flex; flex-direction:column; gap:30px; font-size:15.5px; line-height:1.62; color:#313A45\">\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">1. Objectivo<\u002Fh2>\n            <p style=\"margin:0; text-wrap:pretty\">Avaliar e monitorizar competências relacionadas com leitura e escrita no âmbito do PLE. A bateria é aplicada em dois momentos — Pré e Pós — com os mesmos itens e as mesmas instruções.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">2. O que é avaliado<\u002Fh2>\n            <ul style=\"margin:0; padding-left:22px\">\n              <li>Rimas<\u002Fli>\n              <li>Consciência silábica<\u002Fli>\n              <li>Consciência fonémica<\u002Fli>\n              <li>Correspondência fonema-grafema<\u002Fli>\n              <li>Descodificação (apenas 1.º ano)<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin:12px 0 0; font-size:14.5px; color:#5E6A79\">P5: 20 itens (4 / 4 / 6 / 6). 1.º ano: 24 itens (4 / 4 / 6 / 6 / 4).<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">3. Duração<\u002Fh2>\n            <p style=\"margin:0\">8 a 10 minutos por criança.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">4. Preparação<\u002Fh2>\n            <ul style=\"margin:0; padding-left:22px\">\n              <li>Ambiente tranquilo.<\u002Fli>\n              <li>Criança confortável.<\u002Fli>\n              <li>Sem colegas a responder.<\u002Fli>\n              <li>Dispositivo carregado.<\u002Fli>\n              <li>Aplicação aberta.<\u002Fli>\n              <li>Verificar criança, turma e momento antes de começar.<\u002Fli>\n            <\u002Ful>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">5. Princípios de aplicação<\u002Fh2>\n            <p style=\"margin:0 0 10px\">O avaliador:<\u002Fp>\n            <ul style=\"margin:0; padding-left:22px\">\n              <li>lê a instrução exactamente como está escrita;<\u002Fli>\n              <li>não dá pistas;<\u002Fli>\n              <li>não corrige;<\u002Fli>\n              <li>não ensina;<\u002Fli>\n              <li>não muda a pergunta;<\u002Fli>\n              <li>não sugere respostas;<\u002Fli>\n              <li>não demonstra a resposta;<\u002Fli>\n              <li>mantém atitude neutra e acolhedora.<\u002Fli>\n            <\u002Ful>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">6. Se a criança não responder<\u002Fh2>\n            <p style=\"margin:0\">Esperar brevemente. Repetir a instrução apenas quando a regra do item o permitir. Não reformular de maneira facilitadora. Se continuar sem resposta, registar 0.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">7. Se a criança pedir ajuda<\u002Fh2>\n            <p style=\"margin:0 0 10px\">Resposta neutra:<\u002Fp>\n            <p style=\"margin:0; padding:14px 18px; background:#fff; border:1px solid #E4E9F0; border-radius:12px; font-family:Arial,Helvetica,sans-serif; font-size:20px\">“Pensa mais um bocadinho. Quando estiveres pronta, diz-me.”<\u002Fp>\n            <p style=\"margin:10px 0 0; font-size:14.5px; color:#5E6A79\">Não dar pistas.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">8. Se a criança ficar frustrada<\u002Fh2>\n            <p style=\"margin:0 0 10px\">Manter tom positivo:<\u002Fp>\n            <p style=\"margin:0; padding:14px 18px; background:#fff; border:1px solid #E4E9F0; border-radius:12px; font-family:Arial,Helvetica,sans-serif; font-size:20px\">“Está tudo bem. Vamos experimentar a próxima missão.”<\u002Fp>\n            <p style=\"margin:10px 0 0; font-size:14.5px; color:#5E6A79\">Não revelar se estava certa ou errada.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">9. Pré e Pós<\u002Fh2>\n            <p style=\"margin:0\">Os itens e as instruções são iguais nos dois momentos. Não preparar a criança para as respostas. Não praticar especificamente os itens da avaliação entre os momentos.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">10. Cotação<\u002Fh2>\n            <p style=\"margin:0\">1 = correcto · 0 = incorrecto. Não existe pontuação parcial. Nos itens de produção de rima aceitam-se todas as respostas que cumpram objectivamente o critério. Nas respostas fonémicas, cotar pelo som produzido e não pelo nome da letra.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">11. Registo<\u002Fh2>\n            <p style=\"margin:0\">A aplicação guarda automaticamente cada resposta, com item, domínio, subcompetência, momento, data e criança. Uma avaliação só é considerada concluída quando todos os itens têm registo.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">12. Linguagem dos resultados<\u002Fh2>\n            <p style=\"margin:0\">Os resultados são descritivos. Não se produzem diagnósticos nem juízos clínicos. Formulação aceitável: “A criança obteve 3/6 nos itens de consciência fonémica.”<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">13. Privacidade<\u002Fh2>\n            <p style=\"margin:0\">Os dados ficam guardados apenas neste dispositivo, no armazenamento local do navegador. Não são enviados para serviços externos e não existem páginas públicas de resultados. Recolhe-se apenas nome e turma. As exportações (CSV e PDF) contêm dados pessoais de menores e devem ser tratadas em conformidade.<\u002Fp>\n          <\u002Fsection>\n          <section>\n            <h2 style=\"margin:0 0 8px; font-family:Arial,Helvetica,sans-serif; font-size:26px\">14. Reunir dados de vários dispositivos<\u002Fh2>\n            <p style=\"margin:0 0 10px\">Cada dispositivo guarda as suas próprias avaliações. Para a coordenação ter o conjunto completo:<\u002Fp>\n            <ol style=\"margin:0; padding-left:22px\">\n              <li>em cada iPad, ir a Crianças e usar «Exportar CSV — respostas item a item»;<\u002Fli>\n              <li>enviar os ficheiros para o dispositivo da coordenação;<\u002Fli>\n              <li>nesse dispositivo, usar «Importar CSV de respostas», um ficheiro de cada vez.<\u002Fli>\n            <\u002Fol>\n            <p style=\"margin:12px 0 0\">A importação não duplica avaliações: se uma criança já tiver aquele momento registado, a linha é ignorada e o resumo indica-o. Avaliações incompletas não são importadas. Recomenda-se exportar no fim de cada sessão de avaliação, como cópia de segurança.<\u002Fp>\n          <\u002Fsection>\n        <\u002Farticle>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ manualAuditoria }}\" hint-placeholder-val=\"{{ false }}\">\n        <section>\n          <p style=\"margin:0 0 18px; font-size:14.5px; line-height:1.6; color:#5E6A79; text-wrap:pretty\">Tabela interna de auditoria da bateria. Serve para revisão psicopedagógica, não para aplicação. Os itens assinalados não devem ser alterados sem decisão da equipa.<\u002Fp>\n          <sc-for list=\"{{ auditoria }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <div style=\"margin-bottom:28px\">\n              <h2 style=\"margin:0 0 12px; font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7687\">{{ a.nivel }} · {{ a.n }} itens<\u002Fh2>\n              <div style=\"background:#fff; border:1px solid #E4E9F0; border-radius:16px; overflow:hidden\">\n                <sc-for list=\"{{ a.itens }}\" as=\"i\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:14px 20px; border-bottom:1px solid #EEF2F7; display:grid; grid-template-columns:96px minmax(0,1fr); gap:14px\">\n                    <span style=\"font-family:Arial,Helvetica,sans-serif; font-size:11.5px; color:#545F6E\">{{ i.id }}<\u002Fspan>\n                    <div>\n                      <div style=\"font-size:14.5px; color:#313A45\">{{ i.subcompetencia }}<\u002Fdiv>\n                      <div style=\"margin-top:4px; font-size:13px; color:#64707F\">Resposta: {{ i.resposta }} · {{ i.cotacao }}<\u002Fdiv>\n                      <sc-if value=\"{{ i.temEstado }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"margin-top:8px; display:inline-block; font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; background:#E8F1FD; color:#024FB0\">{{ i.estadoLabel }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ i.temNota }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"margin-top:8px; font-size:13px; line-height:1.55; color:#4F5A67; text-wrap:pretty\">{{ i.nota }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ IMPRESSOS — ESTATÍSTICAS POR TURMA ══ -->\n  <sc-if value=\"{{ isImpressos }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:960px; margin:0 auto; padding:40px 28px 90px; animation:ple-in 0.3s ease-out\">\n      <div data-noprint=\"\" style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px\">\n        <div>\n          <h1 style=\"margin:0 0 4px; font-family:Arial,Helvetica,sans-serif; font-size:44px; line-height:1.1\">Impressos<\u002Fh1>\n          <p style=\"margin:0; font-size:15px; color:#64707F\">Relatório estatístico de turma, pronto a imprimir ou a guardar em PDF.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ imprimir }}\" style=\"font-size:14px; font-weight:500; min-height:44px; padding:0 20px; border-radius:10px; border:none; background:#0361D9; color:#fff\">Imprimir / Guardar PDF<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-noprint=\"\" style=\"margin-bottom:26px\">\n        <div style=\"font-family:Arial,Helvetica,sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B7687; margin-bottom:8px\">Turma<\u002Fdiv>\n        <div style=\"display:flex; gap:7px; flex-wrap:wrap\">\n          <sc-for list=\"{{ imp.turmas }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ t.escolher }}\" style=\"font-size:14px; font-weight:500; min-height:40px; padding:0 16px; border-radius:99px; border:1px solid {{ t.borda }}; background:{{ t.fundo }}; color:{ obalPre = this.descritivo(pres.map(a => this.pontuar(a).total));\n    const globalPos = this.descritivo(poss.map(a => this.pontuar(a).total));\n    const evol = ambos.map(c => this.pontuar(this.avaliacao(c.id, 'Pós')).total - this.pontuar(this.avaliacao(c.id, 'Pré')).total);\n    const globalEvol = this.descritivo(evol);\n    const maxTotal = this.bateria(nivel).itens.length;\n\n    const subtestes = S.DOMINIOS.filter(d => maxDom[d.key] !== undefined).map(d => {\n      const p = this.descritivo(pres.map(a => this.pontuar(a).dom[d.key]));\n      const q = this.descritivo(poss.map(a => this.pontuar(a).dom[d.key]));\n      const varEvol = ambos.map(c => this.pontuar(this.avaliacao(c.id, 'Pós')).dom[d.key] - this.pontuar(this.avaliacao(c.id, 'Pré')).dom[d.key]);\n      const mv = this.media(varEvol);\n      return {\n        label: d.nome, max: String(maxDom[d.key]),\n        preMedia: p.media, preDesvio: p.desvio, preMediana: p.mediana,\n        posMedia: q.media, posDesvio: q.desvio, posMediana: q.mediana,\n        variacao: mv === null ? '—' : this.sinal(mv), varCor: this.varCor(mv === null ? 0 : mv),\n        prePct: pres.length ? Math.round(this.media(pres.map(a => this.pontuar(a).dom[d.key])) / maxDom[d.key] * 100) + '%' : '0%',\n        posPct: poss.length ? Math.round(this.media(poss.map(a => this.pontuar(a).dom[d.key])) / maxDom[d.key] * 100) + '%' : '0%'\n      };\n    });\n\n    const linhasCriancas = cs.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt')).map(c => {\n      const pre = this.avaliacao(c.id, 'Pré'), pos = this.avaliacao(c.id, 'Pós');\n      const a = pre ? this.pontuar(pre) : null, b = pos ? this.pontuar(pos) : null;\n      const v = a && b ? b.total - a.total : null;\n      return {\n        nome: c.nome,\n        pre: a ? a.total + '/' + a.max : '—',\n        pos: b ? b.total + '/' + b.max : '—',\n        variacao: v === null ? '—' : (v > 0 ? '+' : '') + v,\n        varCor: this.varCor(v === null ? 0 : v)\n      };\n    });\n\n    return {\n      impParticipacao: [\n        { valor: String(cs.length), label: 'Crianças na turma' },\n        { valor: String(pres.length), label: 'Pré concluídas' },\n        { valor: String(poss.length), label: 'Pós concluídas' },\n        { valor: String(ambos.length), label: 'Com Pré e Pós' }\n      ],\n      impGlobal: [\n        { label: 'Pré', n: String(globalPre.n), media: globalPre.media, desvio: globalPre.desvio, mediana: globalPre.mediana },\n        { label: 'Pós', n: String(globalPos.n), media: globalPos.media, desvio: globalPos.desvio, mediana: globalPos.mediana },\n        { label: 'Variação Pré → Pós', n: String(globalEvol.n), media: globalEvol.n ? this.sinal(this.media(evol)) : '—', desvio: globalEvol.desvio, mediana: globalEvol.mediana }\n      ],\n      imp: {\n        turmas: S.TURMAS.map(t => Object.assign({ label: t, escolher: () => this.setState({ turmaImpressao: t }) }, this.chip(turma === t))),\n        turma, nivel, maxTotal: String(maxTotal),\n        dataHoje: this.dataPt(new Date().toISOString()),\n        n: String(cs.length), nPre: String(pres.length), nPos: String(poss.length), nAmbos: String(ambos.length),\n        globalPre, globalPos, globalEvol,\n        temEvol: ambos.length > 0,\n        subtestes,\n        linhasCriancas, temCriancas: linhasCriancas.length > 0,\n        semDados: cs.length === 0,\n        _p: 0,\n        notaN: ambos.length < 2\n          ? 'Desvio padrão apresentado apenas quando existem pelo menos duas avaliações. Valores em pontos.'\n          : 'Média, desvio padrão (amostral, n−1) e mediana em pontos. A variação é calculada apenas com as ' + ambos.length + ' crianças que têm Pré e Pós.'\n      }\n    };\n  }\n\n  valsManual() {\n    const S = this.spec();\n    const tab = this.state.tabManual;\n    return {\n      tabsManual: [\n        Object.assign({ label: 'Manual', escolher: () => this.setState({ tabManual: 'manual' }) }, this.chip(tab === 'manual')),\n        Object.assign({ label: 'Auditoria de itens', escolher: () => this.setState({ tabManual: 'auditoria' }) }, this.chip(tab === 'auditoria'))\n      ],\n      manualTexto: tab === 'manual',\n      manualAuditoria: tab === 'auditoria',\n      auditoria: Object.keys(S.baterias).map(k => ({\n        nivel: k, n: S.baterias[k].itens.length,\n        itens: S.baterias[k].itens.map(it => ({\n          id: it.id, subcompetencia: it.subcompetencia, resposta: String(it.resposta),\n          cotacao: it.cotacao || '1 / 0',\n          temEstado: it.estado !== 'ativo',\n          estadoLabel: it.estado === 'a_pilotar' ? 'A pilotar' : it.estado === 'a_validar' ? 'A validar' : '',\n          temNota: !!it.nota, nota: it.nota || ''\n        }))\n      }))\n    };\n  }\n\n  renderVals() {\n    const e = this.state.ecra;\n    const base = {\n      mascoteImagem: this.props.mascoteImagem || (this.state.pronto ? (this.spec().MASCOTE || '') : ''),\n      mascoteGrande: 190, mascotePequeno: 112,\n      textoIntro: 'Olá! Eu sou o Linguaré! Hoje tenho algumas missões para ti. Vamos brincar com palavras, sons e letras!',\n      form: this.state.form,\n      aviso: this.state.aviso, temAviso: !!this.state.aviso,\n      setNome: ev => this.setState({ form: Object.assign({}, this.state.form, { nome: ev.target.value }), aviso: '' }),\n      setTurma: ev => this.setState({ form: Object.assign({}, this.state.form, { turma: ev.target.value }), aviso: '' }),\n      setTexto: ev => this.setState({ texto: ev.target.value }),\n      iniciar: this.iniciar,\n      carregarDemo: this.carregarDemo, apagarTudo: this.apagarTudo,\n      exportarCsvRespostas: this.exportarCsvRespostas, exportarCsvResultados: this.exportarCsvResultados,\n      importarCsv: this.importarCsv, fecharImporte: this.fecharImporte,\n      temImporte: !!this.state.importe,\n      importe: this.state.importe || { titulo: '', linhas: [], erro: false },\n      importeCor: this.state.importe && this.state.importe.erro ? '#B4453C' : '#067A54',\n      importeFundo: this.state.importe && this.state.importe.erro ? '#FBEBEA' : '#E6FBF3',\n      importeBorda: this.state.importe && this.state.importe.erro ? '#F0D8D8' : '#BCEBD8',\n      imprimir: this.imprimir,\n      voltarResultados: () => this.setState({ verId: null }),\n      mostrarChrome: e !== 'run',\n      isDash: e === 'dash', isCriancas: e === 'criancas', isRun: e === 'run',\n      isResLista: e === 'resultados' && !this.state.verId,\n      isResDetalhe: e === 'resultados' && !!this.state.verId,\n      isStats: e === 'stats', isManual: e === 'manual', isImpressos: e === 'impressos',\n      logoReal: this.state.pronto ? (this.spec().LOGO || '') : '',\n      logoFundoDir: FUNDO(''), logoFundoEsq: FUNDO(''), temLogo: false,\n      run: { isIntro: false, isItem: false, isFim: false, temAlvo: false, alvoTemImagem: false, alvoSemImagem: true, alvoFundo: FUNDO(''), cartoes: [], botoes: [], controlo: [], pontos: [] },\n      nav: [\n        { id: 'dash', label: 'Início' }, { id: 'criancas', label: 'Crianças' },\n        { id: 'resultados', label: 'Resultados' }, { id: 'stats', label: 'Estatísticas' },\n        { id: 'impressos', label: 'Impressos' }, { id: 'manual', label: 'Manual' }\n      ].map(n => Object.assign({ label: n.label, ir: this.ir(n.id) },\n        e === n.id\n          ? { fundo: '#E8F1FD', cor: '#0A3A7D', borda: '#C3DAF8' }\n          : { fundo: 'transparent', cor: '#545F6E', borda: 'transparent' }))\n    };\n    if (!this.state.pronto) return base;\n    base.temLogo = !!base.logoReal;\n    base.logoFundoDir = FUNDO(base.logoReal, 'right center');\n    base.logoFundoEsq = FUNDO(base.logoReal, 'left center');\n    return Object.assign(base,\n      this.valsDash(), this.valsCriancas(), this.valsRun(), this.valsRes(), this.valsStats(), this.valsImpressos(), this.valsManual());\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
